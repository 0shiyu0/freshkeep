name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试 + 迁移 + 数据库自检
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freshkeep
          TZ: Asia/Shanghai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d freshkeep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/freshkeep
      DATABASE_URL_PSQL: postgresql://postgres:postgres@127.0.0.1:5432/freshkeep
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt

      # 用迁移建库（而不是直接 psql -f），顺带验证 alembic 链路
      - name: 执行迁移
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current

      # 28 = 27 张业务表 + alembic_version（后者也是 BASE TABLE）
      - name: 表数断言（期望 28）
        run: |
          N=$(psql "$DATABASE_URL_PSQL" -tAc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          echo "tables=$N"
          [ "$N" = "28" ]

      - name: 视图数断言（期望 2）
        run: |
          V=$(psql "$DATABASE_URL_PSQL" -tAc "select count(*) from information_schema.views where table_schema='public'")
          echo "views=$V"
          [ "$V" = "2" ]

      - name: 迁移版本断言（期望 0004_recipe_steps）
        run: |
          V=$(psql "$DATABASE_URL_PSQL" -tAc "select version_num from alembic_version")
          echo "alembic=$V"
          [ "$V" = "0004_recipe_steps" ]

      - name: 数据库验收用例
        run: psql postgresql://postgres:postgres@127.0.0.1:5432/freshkeep -v ON_ERROR_STOP=1 -f database/002_acceptance_check.sql 2>&1 | grep -E "NOTICE|ERROR"

      - name: 代码质量（ruff）
        working-directory: backend
        run: |
          pip install ruff==0.17.4
          ruff check app tests

      - name: pytest（含覆盖率门槛 80%）
        working-directory: backend
        run: pytest -v

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 构建
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  docs:
    name: 文档完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/check-docs.sh

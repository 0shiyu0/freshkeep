<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17803f" />
  <title>离线中 · 鲜度</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f3ee; color: #222; padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .card { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e5e2da;
      border-radius: 16px; padding: 24px; text-align: center; }
    .icon { width: 56px; height: 56px; border-radius: 14px; background: #e7f1ea; color: #17803f;
      display: grid; place-items: center; margin: 0 auto 14px; font-size: 26px; }
    h1 { font-size: 19px; margin: 0 0 8px; }
    p { font-size: 13.5px; line-height: 1.6; color: #666; margin: 0 0 8px; }
    .warn { background: #fdf9ef; border: 1px solid #f0dfb8; border-radius: 10px;
      padding: 10px; font-size: 12.5px; color: #8a6d1f; margin: 14px 0; }
    button { width: 100%; height: 40px; border: 0; border-radius: 10px; background: #17803f;
      color: #fff; font-size: 14px; cursor: pointer; }
    ul { text-align: left; font-size: 12.5px; color: #666; padding-left: 20px; margin: 12px 0 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">○</div>
    <h1>当前离线</h1>
    <p>已缓存的页面可以继续浏览，但库存数据需要连接家里的 NAS 才能读取。</p>
    <div class="warn">为避免账实不符，离线期间不会记录消耗、盘点或入库。恢复联网后再操作。</div>
    <ul>
      <li>库存、流水、金额一律不缓存</li>
      <li>写入操作不会在离线时排队补发</li>
      <li>连接同一局域网后点下方按钮重试</li>
    </ul>
    <button onclick="location.href='/'">重新连接</button>
  </div>
</body>
</html>

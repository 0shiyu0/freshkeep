<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="description" content="鲜度 FreshKeep：记录家中食材库存、保质期与每次取用，自动扣减库存，提示临期食材并统计消耗趋势。数据只存在本机浏览器。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鲜度">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>鲜度 FreshKeep · 食材库存与消耗管家</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2317803f'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle'%3E%F0%9F%A5%95%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view" role="main"></main>
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航"></nav>
  <button class="fab" id="fab" type="button" data-act="add" aria-label="添加食材">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
      <path d="M12 5.2v13.6M5.2 12h13.6"/>
    </svg>
  </button>
</div>

<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>
<div class="sheet-root" id="sheet-root" hidden></div>

<noscript>
  <p style="padding:24px;font-family:sans-serif">鲜度是一个纯前端应用，需要开启 JavaScript 才能使用。</p>
</noscript>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
